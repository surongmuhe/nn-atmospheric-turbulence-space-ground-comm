project:
  name: cross_site_transfer_to_dataWfon0U
  seed: 42
  output_dir: outputs/cross_site_transfer_apr_jun_to_dataWfon0U_20260423
  log_level: INFO

data:
  source_file_path: data/Sklavounos and Cohn, Spring. 2022.xlsx
  source_datetime_col: Date
  source_time_col: Time
  target_file_path: data/dataWfon0U_ml_ready.csv
  target_datetime_col: time
  target_time_col: null
  feature_cols: [LogCn2, Tair, Pair, UmSonic, is_daylight, hour_sin, hour_cos]
  target_col: LogCn2
  seq_len: 144
  pred_len: 3
  resample_rule: 5min
  source_train_ratio: 0.7
  source_val_ratio: 0.15
  target_mode: delta
  target_aggregation: multistep

preprocess:
  scaler: standard
  source_status_col: STATUS
  source_status_keep_values: [0]
  target_status_col: null
  target_status_keep_values: null
  drop_duplicate_timestamps: true
  daylight_proxy:
    enabled: true
    overwrite_existing: true
    start_hour: 6.0
    end_hour: 18.0
  interpolate:
    enabled: true
    method: time
    limit: 3
  missing_indicators:
    enabled: true
    columns: [LogCn2, Tair, Pair, UmSonic]
  missing_context_features:
    enabled: true
    columns: [LogCn2, Tair, Pair, UmSonic]
    include_any_missing: true
    include_missing_fraction: true
    include_max_run_log1p: true
    include_recent_missing: true
    recent_windows: [3, 12]
  long_gap_mask:
    enabled: true
    columns: [LogCn2, Tair, Pair, UmSonic]
    max_missing_run: 6
    pad_steps: 1
  domain_features:
    enabled: false
  solar_regime_features:
    enabled: false
  diff_features:
    enabled: true
    columns: [LogCn2, Tair, UmSonic]
    periods: [1, 3]
  rolling_features:
    enabled: true
    columns: [LogCn2, Tair, UmSonic]
    windows: [3, 12]
    include_mean: true
    include_std: true
    include_min: false
    include_max: false
  clip_quantiles:
    enabled: true
    lower: 0.005
    upper: 0.995
    exclude_cols: [LogCn2]
  time_features:
    keep_temporal_hour: false
    hour_cyclical: true
    dayofyear_cyclical: false

experiment:
  primary_model: gru
  active_models: [gru, lstm, cnn_lstm]
  regime_split:
    enabled: true
    base_model: gru
    alias: gru_regime
    regime_feature: is_daylight
    threshold: 0.5
    labels: [night, day]

train:
  batch_size: 64
  epochs: 60
  learning_rate: 0.001
  weight_decay: 0.0001
  shuffle_train: true
  early_stop_patience: 10
  num_workers: 0
  grad_clip_norm: 1.0
  lr_scale_map:
    cnn_lstm: 0.7
    gru: 0.9

fusion:
  enabled: true
  base_weighting: val_linreg
  fixed_weights: [0.5, 0.3, 0.2]

models:
  mlp:
    hidden_sizes: [256, 128]
    dropout: 0.2
  lstm:
    hidden_size: 64
    num_layers: 2
    dropout: 0.1
  gru:
    hidden_size: 64
    num_layers: 2
    dropout: 0.1
  transformer:
    d_model: 64
    nhead: 4
    num_layers: 2
    ff_dim: 128
    dropout: 0.1
    use_positional_encoding: true
    pooling: last
  tcn:
    channels: [64, 64]
    kernel_size: 3
    dropout: 0.2
  cnn_lstm:
    cnn_channels: 64
    lstm_hidden: 128
    lstm_layers: 2
    dropout: 0.2

wandb:
  enabled: false
  project: null
  entity: null
  run_name: null
